version: '3.8'

services:
  # 🐘 PostgreSQL Database (Local / Self-hosted mirroring Amazon RDS)
  db:
    image: postgres:16-alpine
    container_name: whitehouse_postgres
    restart: always
    environment:
      POSTGRES_DB: whitehouse_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whitehouse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 🚀 Django REST Framework Backend API
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whitehouse_django_api
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_db &&
             gunicorn whitehouse_core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DEBUG: "True"
      SECRET_KEY: "django-insecure-whitehouse-production-key-change-in-aws"
      DATABASE_URL: "postgres://postgres:postgres_secure_password_2026@db:5432/whitehouse_db"
      ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
