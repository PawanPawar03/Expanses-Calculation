services:
  - type: web
    name: whitehouse-expense-server
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build && npm run seed
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TIMEZONE
        value: Asia/Kolkata
